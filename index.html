<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Wulan 16th - Mario Edition</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@700&family=Patrick+Hand&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#FFB6D5;overflow:hidden;font-family:'Fredoka',sans-serif}
#game{width:100vw;height:100vh;display:flex;flex-direction:column;background:linear-gradient(#87D4FF 0%,#B9E8FF 40%,#FFE4EC 40%)}
canvas{width:100%;flex:1;display:block}
#top{height:50px;background:white;display:flex;align-items:center;justify-content:space-between;padding:0 18px;font-weight:700;box-shadow:0 4px 10px rgba(0,0,0,.1)}
#ctrl{height:90px;background:rgba(255,255,255,.9);display:flex;justify-content:space-between;align-items:center;padding:0 20px}
.b{width:62px;height:62px;background:white;border:3px solid #FF8FAB;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:26px;box-shadow:0 4px 12px rgba(0,0,0,.15)}
.b:active{transform:scale(.92)}
#win{position:fixed;inset:0;background:rgba(255,214,231,.98);display:none;flex-direction:column;align-items:center;justify-content:center;padding:18px;z-index:50;overflow:auto}
#txt{font-family:'Patrick Hand',cursive;background:white;padding:20px;border-radius:18px;max-width:560px;white-space:pre-wrap;line-height:1.6;font-size:20px;color:#5A2A40}
</style>
</head>
<body>
<div id="game">
<div id="top"><span>💖 WULAN 16TH</span><span>💰<b id="coin">0</b> | <span id="prog">0%</span></span></div>
<canvas id="c"></canvas>
<div id="ctrl"><div style="display:flex;gap:12px"><div class="b" id="L">◀</div><div class="b" id="R">▶</div></div><div style="display:flex;gap:12px"><div class="b" id="S">👟</div><div class="b" id="J">▲</div></div></div>
</div>
<div id="win">
<h1 style="color:#FF2E7E;font-size:42px;margin-bottom:8px">happy birthday princess! 🎂</h1>
<p style="font-weight:700;color:#FF2E7E;margin-bottom:12px">dari babang ganteng </p>
<div id="txt"></div>
<button onclick="location.reload()" style="margin-top:18px;padding:12px 26px;border-radius:30px;border:none;background:#FF2E7E;color:white;font-size:18px;font-family:'Fredoka'">Main Lagi 💞</button>
</div>
<audio id="bgm" loop src="https://files.catbox.moe/5wttdc.mp3"></audio>
<script>
const canvas=document.getElementById('c'), ctx=canvas.getContext('2d');
const bgm=document.getElementById('bgm');
function resize(){canvas.width=window.innerWidth;canvas.height=window.innerHeight-140} resize(); window.addEventListener('resize',resize);
let keys={}, cam=0, coins=0, speedBoost=0, won=false;
let pl={x:100,y:0,vx:0,vy:0,onG:false,dir:1};
let platforms=[{x:0,y:350,w:500,h:200},{x:600,y:350,w:300,h:20},{x:1000,y:300,w:250,h:20},{x:1400,y:320,w:250,h:20},{x:1800,y:280,w:300,h:20},{x:2200,y:320,w:250,h:20},{x:2600,y:250,w:350,h:20},{x:3100,y:350,w:600,h:200}];
let bricks=[{x:650,y:250,w:40,h:40,hit:false},{x:1050,y:200,w:40,h:40,hit:false},{x:1450,y:220,w:40,h:40,hit:false},{x:1850,y:180,w:40,h:40,hit:false}];
let shoes=[{x:1500,y:280,taken:false}];
let keongs=[{x:700,y:326,w:34,h:24,vx:-1.2,alive:true},{x:1100,y:276,w:34,h:24,vx:-1,alive:true},{x:1900,y:256,w:34,h:24,vx:-1.3,alive:true}];
let particles=[];
pl.y=platforms[0].y-30;
let goal={x:3300,y:280};

function drawGirl(x,y){
ctx.save();ctx.translate(x,y);ctx.scale(1.2,1.2);
ctx.fillStyle='rgba(0,0,0,.15)';ctx.beginPath();ctx.ellipse(0,18,14,5,0,0,7);ctx.fill();
ctx.fillStyle='#FF8FB8';ctx.fillRect(-9,2,8,12);ctx.fillRect(1,2,8,12);
ctx.fillStyle='#FF6BA8';ctx.beginPath();ctx.moveTo(-13,2);ctx.lineTo(13,2);ctx.lineTo(10,-8);ctx.lineTo(-10,-8);ctx.closePath();ctx.fill();
ctx.fillStyle='#FFDDBB';ctx.beginPath();ctx.arc(0,-14,14,0,7);ctx.fill();
ctx.fillStyle='#FF4D9E';ctx.beginPath();ctx.arc(0,-17,15,3.14,0);ctx.fill();ctx.fillRect(-15,-17,5,18);ctx.fillRect(10,-17,5,18);
ctx.fillStyle='black';ctx.beginPath();ctx.arc(-4,-14,2,0,7);ctx.arc(4,-14,2,0,7);ctx.fill();
ctx.restore();
}
function drawBoy(x,y){
ctx.save();ctx.translate(x,y);ctx.scale(1.3,1.3);
ctx.fillStyle='rgba(0,0,0,.15)';ctx.beginPath();ctx.ellipse(0,20,15,6,0,0,7);ctx.fill();
ctx.fillStyle='#5B8DEF';ctx.fillRect(-10,4,9,14);ctx.fillRect(1,4,9,14);
ctx.fillStyle='#4A90E2';ctx.fillRect(-13,-6,26,14);
ctx.fillStyle='#FFDDBB';ctx.beginPath();ctx.arc(0,-13,12,0,7);ctx.fill();
ctx.fillStyle='#222';ctx.beginPath();ctx.arc(0,-18,12,3.14,0);ctx.fill();
ctx.fillStyle='#FFD93D';ctx.fillRect(12,-2,14,14);ctx.fillStyle='#FF2E7E';ctx.fillRect(12,3,14,3);
ctx.restore();
}
function drawKeong(k){
if(!k.alive)return;
ctx.fillStyle='#FF9A3E';ctx.beginPath();ctx.arc(k.x+12,k.y+8,10,0,7);ctx.fill();
ctx.fillStyle='#FFE29A';ctx.beginPath();ctx.arc(k.x+12,k.y+8,5,0,7);ctx.fill();
ctx.fillStyle='#8B5A2B';ctx.fillRect(k.x,k.y+12,k.w,12);
}
function update(){
if(won)return;
let mv=0;if(keys['ArrowLeft']||keys['a'])mv=-1;if(keys['ArrowRight']||keys['d'])mv=1;
let spd=speedBoost>0?7.5:4.5;
pl.vx=mv*spd;if(mv!=0)pl.dir=mv;
pl.vy+=0.6;pl.x+=pl.vx;pl.y+=pl.vy;pl.onG=false;
for(let p of platforms){
if(pl.x+12>p.x&&pl.x-12<p.x+p.w){
if(pl.vy>0&&pl.y+12>p.y&&pl.y-10<p.y){pl.y=p.y-12;pl.vy=0;pl.onG=true;}
if(pl.vy<0&&pl.y-20<p.y+p.h&&pl.y-10>p.y+p.h-10){pl.y=p.y+p.h+22;pl.vy=0;}
}
}
for(let b of bricks){
if(!b.hit&&pl.x+12>b.x&&pl.x-12<b.x+b.w&&pl.vy<0&&pl.y-20<b.y+b.h&&pl.y>b.y){
b.hit=true;coins+=5;particles.push({x:b.x+20,y:b.y,t:20,type:'coin'});
if(Math.random()>0.5)shoes.push({x:b.x,y:b.y-30,taken:false});
pl.vy=3;
}
}
for(let s of shoes){
if(!s.taken&&Math.abs(pl.x-s.x)<25&&Math.abs(pl.y-s.y)<25){s.taken=true;speedBoost=480;coins+=2;}
}
for(let k of keongs){
if(!k.alive)continue;
k.x+=k.vx;
if(k.x<600||k.x>3400)k.vx*=-1;
if(Math.abs(pl.x-k.x)<22&&Math.abs(pl.y-k.y)<18){
if(pl.vy>0){k.alive=false;pl.vy=-8;coins+=3;particles.push({x:k.x,y:k.y,t:15,type:'pop'});}
else{pl.x=100;pl.y=platforms[0].y-30;pl.vy=0;}
}
}
if(speedBoost>0)speedBoost--;
if(pl.y>600){pl.x=100;pl.y=platforms[0].y-30;pl.vy=0}
cam=pl.x-canvas.width/2.5;if(cam<0)cam=0;if(cam>2600)cam=2600;
document.getElementById('coin').innerText=coins;
document.getElementById('prog').innerText=Math.min(100,Math.floor(pl.x/33))+'%';
if(Math.abs(pl.x-goal.x)<35&&Math.abs(pl.y-goal.y)<40)doWin();
}
function doWin(){
if(won)return;won=true;
bgm.volume=0.8;bgm.play();
document.getElementById('win').style.display='flex';
let pesan=`happy birthday princess kesayangan akuu semoga di ulang tahun kamu yang ke 16 kebaikan dan keberuntungan selalu ngikutin kamu ya sayang maapp soal bulan bulan sebelum nya sayaang terima kasih kamu uda selalu ada buat aku selalu jadi rumah ternyaman di saat aku lagi capee di saat aku lagi butuh kamu sayangg kitaa sama sama berproses ya sayang kita jalanin hubungan ini smaa samaa sayangg semoga samaa kamu bukan cuma sementara tapi selama nya sayangg sayang dedee banyakk banyakk💞\n\n- dari babang ganteng `;
let i=0, el=document.getElementById('txt');
(function type(){if(i<pesan.length){el.textContent+=pesan[i++];setTimeout(type,28)}})();
}
function draw(){
ctx.clearRect(0,0,canvas.width,canvas.height);
ctx.save();ctx.translate(-cam,0);
// bg deco
ctx.fillStyle='white';ctx.globalAlpha=.8;
[[200,60],[800,80],[1600,70],[2500,60]].forEach(([x,y])=>{ctx.beginPath();ctx.arc(x,y,18,0,7);ctx.arc(x+22,y,26,0,7);ctx.arc(x+44,y,18,0,7);ctx.fill()});
ctx.globalAlpha=1;
for(let p of platforms){ctx.fillStyle='#fff';ctx.fillRect(p.x,p.y,p.w,p.h);ctx.fillStyle='#FF8FAB';ctx.fillRect(p.x,p.y,p.w,8)}
for(let b of bricks){if(b.hit)continue;ctx.fillStyle='#FFB84D';ctx.fillRect(b.x,b.y,b.w,b.h);ctx.fillStyle='#FF9A00';ctx.fillRect(b.x,b.y,b.w,6);ctx.strokeStyle='#8B5A2B';ctx.strokeRect(b.x,b.y,b.w,b.h);ctx.fillStyle='#fff';ctx.font='bold 18px sans-serif';ctx.fillText('?',b.x+13,b.y+26)}
for(let s of shoes){if(s.taken)continue;ctx.font='24px serif';ctx.fillText('👟',s.x,s.y)}
for(let k of keongs)drawKeong(k);
for(let pt of particles){pt.t--;if(pt.type==='coin'){ctx.fillStyle='gold';ctx.font='18px sans-serif';ctx.fillText('💰+5',pt.x,pt.y-pt.t)}}
particles=particles.filter(p=>p.t>0);
drawBoy(goal.x,goal.y);
ctx.save();if(pl.dir===-1){ctx.translate(pl.x,0);ctx.scale(-1,1);ctx.translate(-pl.x,0);}drawGirl(pl.x,pl.y);ctx.restore();
ctx.restore();
if(speedBoost>0){ctx.fillStyle='#4A90E2';ctx.font='bold 16px Fredoka';ctx.fillText('⚡ SPEED BOOST!',20,70)}
}
(function loop(){update();draw();requestAnimationFrame(loop)})();
window.addEventListener('keydown',e=>{keys[e.key]=true;if((e.code==='Space'||e.code==='ArrowUp')&&pl.onG)pl.vy=-11});
window.addEventListener('keyup',e=>keys[e.key]=false);
document.getElementById('L').addEventListener('touchstart',()=>keys['ArrowLeft']=true);document.getElementById('L').addEventListener('touchend',()=>keys['ArrowLeft']=false);
document.getElementById('R').addEventListener('touchstart',()=>keys['ArrowRight']=true);document.getElementById('R').addEventListener('touchend',()=>keys['ArrowRight']=false);
document.getElementById('J').addEventListener('touchstart',()=>{if(pl.onG)pl.vy=-11});document.getElementById('S').addEventListener('touchstart',()=>{if(pl.onG)pl.vy=-11});
canvas.addEventListener('touchstart',()=>{});
}
</script>
</body>
</html>
